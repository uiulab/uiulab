<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">William Chaves, Product Designer</title>
  <desc id="d">Construo produtos para escalar. Mais de 1 milhão de pessoas impactadas.</desc>
  <style>
    /* Para trocar a identidade, mude só estes quatro valores */
    :root { --bg: #ECEEF0; --ink: #14171A; --muted: #5B6470; --line: #C9CED4; }
    text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .rule { stroke: var(--line); stroke-width: 1; }
    .meta { font-size: 18px; font-weight: 500; fill: var(--muted); }
    .hero { font-size: 92px; font-weight: 800; letter-spacing: -3.5px; }
    .num { font-size: 96px; font-weight: 800; letter-spacing: -3px; }
    .label { font-size: 20px; font-weight: 500; fill: var(--muted); }
    .sub { font-size: 20px; font-weight: 400; fill: var(--muted); }
    .a1 { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .a2 { animation: rise .9s .15s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .a1, .a2 { animation: none; } }
  </style>

  <rect class="bg" width="1200" height="400" rx="18"/>

  <text class="meta" x="56" y="64">William Chaves, Product Designer</text>
  <text class="meta" x="1144" y="64" text-anchor="end">2027</text>
  <line class="rule" x1="56" y1="88" x2="1144" y2="88"/>

  <text class="hero a1" x="52" y="200">Construo produtos</text>
  <text class="hero a2" x="52" y="294">para escalar.</text>

  <text class="num" x="1144" y="226" text-anchor="end">1M+</text>
  <text class="label" x="1144" y="262" text-anchor="end">pessoas impactadas</text>

  <line class="rule" x1="56" y1="326" x2="1144" y2="326"/>
  <text class="sub" x="56" y="364">Discovery, estratégia de produto e design systems. Transformo caos em clareza.</text>
  
</svg>
