<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">6 anos de Product Design, 1 milhão de pessoas impactadas, 3 produtos premiados, 40% menos tempo de desenvolvimento</title>
  <style>
    :root { --bg: #ECEEF0; --ink: #14171A; --muted: #5B6470; --line: #C9CED4; }
    text { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .rule { stroke: var(--line); stroke-width: 1; }
    .n { font-size: 64px; font-weight: 800; letter-spacing: -2px; }
    .l { font-size: 18px; font-weight: 500; fill: var(--muted); }
  </style>

  <rect class="bg" width="1200" height="170" rx="18"/>

  <line class="rule" x1="300" y1="34" x2="300" y2="136"/>
  <line class="rule" x1="600" y1="34" x2="600" y2="136"/>
  <line class="rule" x1="900" y1="34" x2="900" y2="136"/>

  <text class="n" x="56" y="96">6+</text>
  <text class="l" x="56" y="128">anos de Product Design</text>

  <text class="n" x="356" y="96">1M+</text>
  <text class="l" x="356" y="128">pessoas impactadas</text>

  <text class="n" x="656" y="96">3</text>
  <text class="l" x="656" y="128">produtos premiados</text>

  <text class="n" x="956" y="96">40%</text>
  <text class="l" x="956" y="128">menos tempo de dev</text>
</svg>
